
name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Add Unity Nuget
        run: dotnet add package UnityEngine.Modules --version 2021.3.18
      - name: Build DLL
        run: dotnet build --configuration Release
      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: ErroratoMenu
          path: bin/Release/netstandard2.1/*.dll
